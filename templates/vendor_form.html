{% extends "base.html" %}
{% set active_nav = 'vendors' %}
{% set active_label = page_title %}
{% block title %}{{ page_title }} &middot; {{ app_name }}{% endblock %}
{% block topbar %}{{ page_title }}{% endblock %}
{% block actions %}<a class="btn" href="/vendors">Back to vendors</a>{% endblock %}
{% block content %}
<div class="card pad" style="max-width:640px">
  <form method="post" action="/vendors/{{ row.id }}">
    <div class="field">
      <label for="name">Vendor name <span style="color:var(--red)">*</span></label>
      <input type="text" id="name" name="name" required value="{{ row.name }}" placeholder="AWS Cloud">
    </div>
    <div class="row">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ row.email }}" placeholder="billing@aws.amazon.com">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" value="{{ row.phone }}">
      </div>
    </div>
    <div class="field">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" value="{{ row.address }}">
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" placeholder="Subscription plan, renewal date…">{{ row.notes }}</textarea>
    </div>
    <div class="form-actions">
      <a class="btn" href="/vendors">Cancel</a>
      <button class="btn primary" type="submit">Save vendor</button>
    </div>
  </form>
</div>
{% endblock %}
